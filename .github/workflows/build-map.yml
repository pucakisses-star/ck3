name: Build map assets

# Rebuilds docs/ (the GitHub Pages site) whenever the app sources or the mod's
# map data change on main: regenerates docs/map/* from the mod files, bundles
# the Vite/Three.js app, and commits the result back to main. Pages then
# serves the fresh build from /docs — no binaries ever travel through PRs.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'tools/build_fixed_map.py'
      - 'package.json'
      - 'vite.config.ts'
      - 'map_data/**'
      - 'common/landed_titles/**'
      - 'history/provinces/**'
      - 'tools/build_map_objects.py'
      - 'tools/build_coa.py'
      - 'tools/province_art.json'
      - 'common/coat_of_arms/**'
      - 'common/named_colors/**'
      - 'gfx/*'
      - 'coat_of_arms/**'
      - 'models/**'
      - 'map/map_object_data/**'
      - 'interface/**'
      - 'icons/**'
      - 'content_source/map_objects/**'
      - 'worldsource/**'
      - '.github/workflows/build-map.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-map
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Generate map assets from mod data
        run: python tools/build_fixed_map.py

      - name: Convert the mod's 3-D models & placements
        run: python tools/build_map_objects.py

      - name: Render realm coats of arms
        run: python tools/build_coa.py

      - name: Build app into docs/
        run: |
          npm ci
          rm -rf docs/assets
          npm run build

      # Second page: the invented world drawn in worldsource/worldmap.png.
      # Its map_data set is pre-generated locally (tools/build_world_from_image.py
      # needs scipy/scikit-image) and committed under worldsource/map_data/;
      # here we only run the standard pipeline on it and bundle the app with
      # the /ck3/world/ base so Pages serves it at <site>/world/.
      - name: Name the world's oceans and ranges
        run: python tools/build_world_names.py

      - name: Generate world-page map assets
        run: python tools/build_fixed_map.py
        env:
          GH_MAP_DATA: worldsource/map_data
          GH_TERRAIN_FILE: worldsource/map_data/00_province_terrain.txt
          GH_OUT_DIR: docs/world/map
          GH_NAMES_FILE: worldsource/map_data/names.csv

      - name: Invent the world's realms, cultures and faiths
        run: python tools/build_world_polity.py
        env:
          GH_OUT_DIR: docs/world/map

      - name: Render the world's realm coats of arms
        run: python tools/build_coa.py
        env:
          GH_META_FILE: docs/world/map/meta.json
          GH_COA_OUT_DIR: docs/world/map/ui/coa
          GH_BORROW_COA: "1"

      - name: Build world page into docs/world/
        run: |
          rm -rf docs/world/assets
          npx vite build --base=/ck3/world/ --outDir docs/world

      - name: Commit built site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/
          if git diff --cached --quiet; then
            echo 'docs/ unchanged'
          else
            git commit -m 'Build map assets [skip ci]'
            git push
          fi
